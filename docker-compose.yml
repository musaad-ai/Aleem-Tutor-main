# Local dev orchestration. The same image (built from ./Dockerfile)
# ships unchanged to any container PaaS (Fly.io, Cloud Run, Render) or
# a plain VM — only env vars and the volume strategy change there.

services:
  aleem:
    build: .
    image: aleem:dev
    container_name: aleem
    ports:
      - "8000:8000"
    env_file:
      # `format: raw` skips $-interpolation so secrets like
      # CHAINLIT_AUTH_SECRET that contain literal `$` are passed
      # through untouched. Requires compose v2.30+ (we use 5.1.3).
      - path: .env
        format: raw
    environment:
      # Redirect HuggingFace's cache into a named volume so the ~3 GB
      # Jina-v4 + reranker download survives container rebuilds.
      HF_HOME: /cache/huggingface
      # Point Chroma at the bind-mounted host directory below.
      CHROMA_DIR: /app/chroma
    volumes:
      # Live code mounts — overlay the baked image dirs so edits take
      # effect without a rebuild. Drop these in a prod override file
      # to use the immutable baked copies.
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./prompts:/app/prompts
      - ./config.yaml:/app/config.yaml:ro
      - ./pyproject.toml:/app/pyproject.toml:ro

      # Stateful host bind mounts — survive `docker compose down`.
      - ./chroma:/app/chroma
      - ./Data:/app/Data
      - ./.aleem:/app/.aleem
      - ./logs:/app/logs

      # Persistent HF model cache (named volume, lives in Docker's
      # storage; survives image rebuilds).
      - hf-cache:/cache/huggingface
    restart: unless-stopped

volumes:
  hf-cache:
